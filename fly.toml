# Discord Bot 部署用。請在專案根目錄執行：fly deploy
# app 名稱：howmay-type-bot（需先 fly apps create howmay-type-bot）

app = "howmay-type-bot"

[build]
  dockerfile = "discord-bot/Dockerfile"

[env]
  PORT = "8080"
  # 不在 Fly 跑 sharp，改由 GitHub Actions 壓縮，可降 VM 記憶體
  SKIP_OPTIMIZE_IMAGES = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  # 壓縮改由 GitHub Actions；若 git push 或程序 OOM，可改回 512mb
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
