<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字圖管理</title>
<style>
  :root {
    --bg: #161616; --panel: #1f1f1f; --wall: #111; --fg: #eee; --mut: #8f8f8f;
    --line: #2e2e2e; --accent: #d7ea06; --warn: #e6a23c; --bad: #e5604f; --ok: #6cc28a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "PingFang TC", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  h1 { font-size: 16px; margin: 0 6px 0 0; }
  .count { color: var(--mut); }
  .count b { color: var(--fg); font-size: 15px; }
  .count b.todo { color: var(--accent); }
  .progress { display: flex; width: 160px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .progress span:first-child { background: var(--ok); }
  #pRedo { background: var(--warn); }
  #pSwap { background: var(--bad); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button b { font-weight: 400; color: var(--mut); margin-left: 2px; }
  .seg button.on b { color: inherit; }
  button, select, input { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; }
  button.on { color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=search] { width: 160px; }
  .hint { color: var(--mut); font-size: 12px; flex-basis: 100%; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }
  /* 版面：左邊預覽卡片網格，右邊固定的共用編輯面板 */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
  main { padding: 12px 16px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min, 270px), 1fr)); gap: 8px; align-items: start; }
  main > p { grid-column: 1 / -1; }
  .row { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; cursor: pointer; }
  .row.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .row.st-ok .stage { opacity: 0.7; }
  .row.is-hidden .stage { opacity: 0.35; }
  .row.st-ok.current .stage { opacity: 1; }
  .stage { position: relative; height: var(--stage-h, 190px); background: var(--wall); display: flex; align-items: center; justify-content: center; padding: 4px; overflow: hidden; }
  .stage.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .wm { flex: none; max-width: 100%; max-height: 100%; height: auto !important; background: #f2f2f2; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  /* 右側面板 */
  .panel { position: sticky; top: var(--head-h, 0px); height: calc(100vh - var(--head-h, 0px)); overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
  .panel .empty { color: var(--mut); }
  .panel h2 { font-size: 16px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .panel h2 a { color: var(--mut); font-size: 12px; font-weight: 400; }
  .panel .pos { color: var(--mut); }
  .panel .orig { background: #000; border-radius: 6px; overflow: hidden; aspect-ratio: 1; }
  .panel .orig img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .panel .orig .none { height: 100%; display: grid; place-items: center; color: var(--mut); }
  .flags { display: flex; gap: 4px; flex-wrap: wrap; }
  .flag { font-size: 11px; padding: 0 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--mut); }
  .flag.warn { color: var(--warn); border-color: #5a4320; }
  .flag.bad { color: var(--bad); border-color: #5a2a24; }
  .flag.ok { color: var(--ok); border-color: #24452f; }
  .ctl { display: grid; grid-template-columns: 34px 1fr 58px; gap: 6px; align-items: center; color: var(--mut); }
  .ctl input[type=range] { width: 100%; accent-color: var(--accent); }
  .ctl input[type=number] { width: 58px; padding: 3px 5px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .acts button { padding: 6px 6px; }
  .acts { grid-template-columns: 1fr 1fr; }
  .acts #pHide { grid-column: 1 / -1; }
  .status-seg { display: grid; grid-template-columns: repeat(4, 1fr); }
  .status-seg button { padding: 6px 2px; }
  .status-seg button.on.st-todo { background: #333; color: var(--fg); }
  .status-seg button.on.st-ok { background: #24452f; color: #fff; }
  .status-seg button.on.st-redo { background: #6b4a16; color: #fff; }
  .status-seg button.on.st-swap { background: #6a2a22; color: #fff; }
  .acts button.on { color: var(--accent); }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: 46vh; border-left: 0; border-top: 1px solid var(--line); z-index: 6; }
    main { padding-bottom: 50vh; }
  }
  .tools { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .zoom { display: flex; align-items: center; gap: 6px; color: var(--mut); font-size: 12px; }
  .zoom input { width: 110px; accent-color: var(--accent); padding: 0; }
  .status { font-size: 12px; color: var(--mut); min-height: 1.4em; }
  .status.err { color: var(--bad); }
  /* 精修視窗（/__wordmarks/editor）疊在整個管理頁上 */
  #editorFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 100; display: none; background: transparent; color-scheme: normal; }
  #editorFrame.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>字圖管理</h1>
  <span class="progress" aria-hidden="true" title="綠：已確認／橘：重新去背／紅：需要換圖"><span id="pDone"></span><span id="pRedo"></span><span id="pSwap"></span></span>
  <div class="seg" id="filter">
    <button data-f="todo" class="on">待處理 <b id="cTodo"></b></button>
    <button data-f="done">已確認 <b id="cDone"></b></button>
    <button data-f="swap">需要換圖 <b id="cSwap"></b></button>
    <button data-f="hidden">隱藏 <b id="cHidden"></b></button>
    <button data-f="all">全部 <b id="cAll"></b></button>
  </div>
  <div class="tools">
    <label class="zoom">預覽比例 <input type="range" id="zoom" min="0.3" max="1.5" step="0.05"> <span id="zoomVal"></span></label>
    <select id="sort" aria-label="排序">
      <option value="risk">依風險排序</option>
      <option value="edited">最近編輯</option>
      <option value="date">依日期（新到舊）</option>
      <option value="name">依名稱</option>
      <option value="size">依字牆大小（大→小）</option>
    </select>
    <input type="search" id="q" placeholder="搜尋作品名稱" aria-label="搜尋作品名稱">
  </div>
  <div class="hint">所有預覽用同一個比例（上方「預覽比例」），可以直接比較大小。<kbd>J</kbd>/<kbd>K</kbd>（或方向鍵）上下一件、<kbd>Enter</kbd> 確認並下一件、<kbd>H</kbd> 隱藏、<kbd>R</kbd> 重新去背、<kbd>N</kbd> 需要換圖、<kbd>E</kbd> 或點兩下編輯去背、<kbd>-</kbd>/<kbd>=</kbd> 縮小放大。把圖拖到預覽區即可換圖。</div>
</header>
<div class="layout"><main id="list"></main><aside class="panel" id="panel" aria-label="編輯面板"></aside></div>
<input type="file" id="file" accept="image/*" hidden>
<iframe id="editorFrame" title="字圖精修" allowtransparency="true"></iframe>
<script>
// 和字牆相同的尺寸公式（ProjectCard.astro + gridViewMode.js），D = 1180 的桌機分段
const UNIT = Math.min(130, Math.max(68, 1180 * 0.074));
const INK_REF = 0.3;
// 手動大小倍率的範圍
const SCALE_MIN = 0.3, SCALE_MAX = 2.5;
// 預覽比例：所有卡片用同一個比例縮放字牆尺寸，大小可以直接互相比較
// 預設 0.85（原本 0.55 的 1.5 倍）；之前存過的比例也一併放大 1.5 倍
let ZOOM = (() => {
  try {
    const v2 = parseFloat(localStorage.getItem("wm-admin-zoom2"));
    if (v2) return v2;
    const v1 = parseFloat(localStorage.getItem("wm-admin-zoom"));
    return v1 ? Math.min(1.5, Math.round(v1 * 1.5 * 20) / 20) : 0.85;
  } catch (_) { return 0.85; }
})();
function applyZoom() {
  const main = document.querySelector("main");
  // 格子大小跟著預覽比例；格子比字略大一點，讓字在格中佔得滿
  main.style.setProperty("--stage-h", `${Math.round(Math.min(380, Math.max(110, 250 * ZOOM)))}px`);
  main.style.setProperty("--card-min", `${Math.round(Math.min(420, Math.max(150, 240 * ZOOM)))}px`);
  const z = document.getElementById("zoom");
  if (z) { z.value = ZOOM; document.getElementById("zoomVal").textContent = `${Math.round(ZOOM * 100)}%`; }
}
const clampScale = (v) => Math.min(SCALE_MAX, Math.max(SCALE_MIN, Math.round(v * 100) / 100));
const countChars = (t) => Math.max(1, (t.match(/[\p{Script=Han}\p{Script=Bopomofo}\p{Script=Hiragana}\p{Script=Katakana}]/gu)?.length ?? 0) + (t.match(/[A-Za-z0-9]/g)?.length ?? 0) * 0.5);
function wallWidth(p) {
  const wm = p.wordmark, aspect = p.size.width / p.size.height;
  const chars = wm.chars ?? countChars(p.title);
  const ink = Math.min(0.8, Math.max(0.08, wm.ink ?? INK_REF));
  const sizeMul = ({ s: 0.8, m: 1, l: 1.3 })[wm.size ?? "m"];
  const mass = Math.max(1.6, (chars * (INK_REF / ink) ** 0.2 * sizeMul ** 2) ** 0.8);
  // 手動倍率最後直接乘在寬度上
  return Math.min(UNIT * Math.sqrt(mass * aspect) * (wm.scale ?? 1), 1180);
}
// 面板上的提醒：只留需要注意的資訊（狀態、大小、字數在面板上本來就看得到）
function tipsOf(p) {
  const wm = p.wordmark, aspect = p.size.width / p.size.height, f = [];
  if (wm.source === "auto") f.push(["warn", "自動去背，未手動處理"]);
  if (aspect < 0.35 || aspect > 3.5) f.push(["warn", "長寬比極端"]);
  if ((wm.ink ?? 0.3) < 0.1) f.push(["warn", "墨量很少，筆畫可能被吃掉"]);
  return f;
}
function flagsOf(p) {
  const wm = p.wordmark, f = [];
  const aspect = p.size.width / p.size.height;
  if (wm.reviewed) f.push(["ok", "已確認"]);
  if (wm.hidden) f.push(["bad", "隱藏中"]);
  if (wm.redo) f.push(["warn", "待重新去背"]);
  if (wm.needsImage) f.push(["bad", "需要換圖"]);
  f.push(wm.source === "auto" ? ["warn", "自動去背"] : ["", "手作去背"]);
  if (aspect < 0.35 || aspect > 3.5) f.push(["warn", "長寬比極端"]);
  if ((wm.ink ?? 0.3) < 0.1) f.push(["warn", "墨量很少"]);
  if ((wm.ink ?? 0.3) > 0.6) f.push(["warn", "墨量很多，可能有底色"]);
  if (wm.chars) f.push(["", `字數 ${wm.chars}`]);
  if (wm.scale && wm.scale !== 1) f.push(["", `大小 ×${wm.scale}`]);
  return f;
}
// 每件作品只有一個狀態（資料上是 reviewed / redo / needsImage 三個欄位，互斥）
const STATUS = { todo: "待處理", ok: "已確認", redo: "重新去背", swap: "需要換圖" };
const statusOf = (wm) => (wm.needsImage ? "swap" : wm.redo ? "redo" : wm.reviewed ? "ok" : "todo");
const risk = (p) => (statusOf(p.wordmark) === "todo" ? 100 : 0) + (p.wordmark.hidden ? 30 : 0) + (p.wordmark.source === "auto" ? 20 : 0) + flagsOf(p).filter((f) => f[0] === "warn").length * 10;

let all = [], view = [], cur = 0, filter = "todo";
const $ = (id) => document.getElementById(id);
const api = async (url, opt) => {
  const r = await fetch(url, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};

async function load() {
  all = (await api("/__wordmarks/api/list")).filter((p) => p.wordmark && p.size);
  render();
}
function counts() {
  const n = { todo: 0, ok: 0, redo: 0, swap: 0 };
  for (const p of all) n[statusOf(p.wordmark)]++;
  $("cTodo").textContent = n.todo;
  $("cDone").textContent = n.ok;
  $("cSwap").textContent = n.swap;
  $("cHidden").textContent = all.filter((p) => p.wordmark.hidden).length;
  $("cAll").textContent = all.length;
  const pct = (v) => `${(v / Math.max(1, all.length)) * 100}%`;
  $("pDone").style.width = pct(n.ok);
  $("pRedo").style.width = pct(n.redo);
  $("pSwap").style.width = pct(n.swap);
}
function render(keepSlug) {
  counts();
  const q = $("q").value.trim();
  view = all.filter((p) =>
    (filter === "all" || (filter === "hidden" ? p.wordmark.hidden : statusOf(p.wordmark) === ({ done: "ok" })[filter] || statusOf(p.wordmark) === filter)) &&
    (!q || p.title.includes(q) || p.slug.includes(q)));
  const s = $("sort").value;
  const wholeSize = (p) => wallWidth(p) / Math.sqrt(p.size.width / p.size.height);
  view.sort(s === "edited" ? (a, b) => (b.edited ?? 0) - (a.edited ?? 0) : s === "size" ? (a, b) => wholeSize(b) - wholeSize(a) : s === "date" ? (a, b) => b.date.localeCompare(a.date) : s === "name" ? (a, b) => a.title.localeCompare(b.title, "zh-Hant") : (a, b) => risk(b) - risk(a) || b.date.localeCompare(a.date));
  const L = $("list");
  L.innerHTML = view.length ? "" : `<p class="count">這個篩選條件下沒有作品${filter === "todo" ? "，全部都處理完了 🎉" : ""}。</p>`;
  view.forEach((p) => L.appendChild(rowEl(p)));
  if (keepSlug) cur = Math.max(0, view.findIndex((p) => p.slug === keepSlug));
  cur = Math.min(cur, Math.max(0, view.length - 1));
  highlight(false);
}
function rowEl(p) {
  const wm = p.wordmark;
  const el = document.createElement("section");
  el.className = `row st-${statusOf(wm)}${wm.hidden ? " is-hidden" : ""}`;
  el.dataset.slug = p.slug;
  const w = wallWidth(p);
  el.innerHTML = `
    <div class="stage" title="${p.title}${wm.hidden ? "（字牆上隱藏中）" : ""}${wm.scale && wm.scale !== 1 ? `・大小 ×${wm.scale}` : ""}">
      <span class="wm" style="--src:url('/projects/${encodeURIComponent(p.slug)}/wordmark.webp?v=${p.mtime}');width:${(w * ZOOM).toFixed(0)}px;aspect-ratio:${p.size.width}/${p.size.height}" role="img" aria-label="${p.title} 字圖"></span>
    </div>
`;
  el.addEventListener("click", () => { cur = view.indexOf(p); highlight(false); });
  // 點兩下直接打開精修視窗
  el.addEventListener("dblclick", () => { cur = view.indexOf(p); highlight(false); openEditor(p); });
  const stage = el.querySelector(".stage");
  stage.addEventListener("dragover", (e) => { e.preventDefault(); stage.classList.add("drop"); });
  stage.addEventListener("dragleave", () => stage.classList.remove("drop"));
  stage.addEventListener("drop", (e) => {
    e.preventDefault(); e.stopPropagation(); stage.classList.remove("drop");
    const f = e.dataTransfer.files?.[0];
    if (f) replace(p, f);
  });
  return el;
}

// ── 右側共用面板：顯示目前選取的作品 ─────────────────────────────
function renderPanel(p) {
  const P = $("panel");
  if (!p) { P.innerHTML = `<p class="empty">點選左邊的作品開始編輯。</p>`; return; }
  const wm = p.wordmark;
  P.innerHTML = `
    <h2><span>${p.title}</span><a href="/projects/${encodeURIComponent(p.slug)}" target="_blank" rel="noopener">作品頁 ↗</a></h2>
    <div class="pos">${view.indexOf(p) + 1} / ${view.length}${wm.hidden ? "　・字牆上隱藏中" : ""}</div>
    <div class="seg status-seg" role="group" aria-label="狀態">
      ${Object.entries(STATUS).map(([k, t]) => `<button data-st="${k}" class="st-${k}${statusOf(wm) === k ? " on" : ""}" title="${({ todo: "", ok: "Enter：確認並下一件", redo: "R", swap: "N：會一併隱藏" })[k]}">${t}</button>`).join("")}
    </div>
    ${tipsOf(p).length ? `<div class="flags">${tipsOf(p).map(([c, t]) => `<span class="flag ${c}">${t}</span>`).join("")}</div>` : ""}
    <div class="ctl">
      <label for="pScale">大小</label><input type="range" id="pScale" min="${SCALE_MIN}" max="${SCALE_MAX}" step="0.05" value="${wm.scale ?? 1}"><input type="number" id="pScaleNum" min="${SCALE_MIN}" max="${SCALE_MAX}" step="0.05" value="${(wm.scale ?? 1).toFixed(2)}" aria-label="大小倍率">
      <label for="pChars">字數</label><input type="number" id="pChars" min="0.5" max="20" step="0.5" value="${wm.chars ?? ""}" placeholder="${countChars(p.title)}"><span></span>
    </div>
    <div class="acts">
      <button id="pEdit" title="E">編輯去背</button>
      <button id="pReplace" title="上傳別張圖">換圖…</button>
      <button id="pHide" title="H">${wm.hidden ? "在字牆顯示" : "在字牆隱藏"}</button>
    </div>
    <div class="status" id="panelStatus" aria-live="polite"></div>
    <div class="orig">${p.post ? `<img src="${p.post}" alt="${p.title} 原圖">` : `<div class="none">沒有貼文圖</div>`}</div>`;
  const card = rowOf(p);
  const range = $("pScale"), num = $("pScaleNum");
  const preview = (v) => {
    p.wordmark.scale = v;
    range.value = v;
    num.value = v.toFixed(2);
    if (card) resizePreview(card, p);
  };
  range.addEventListener("input", () => preview(clampScale(parseFloat(range.value))));
  range.addEventListener("change", () => save(p, { scale: clampScale(parseFloat(range.value)) }).then(() => refreshCard(p)));
  num.addEventListener("change", () => {
    const v = clampScale(parseFloat(num.value) || 1);
    preview(v);
    save(p, { scale: v }).then(() => refreshCard(p));
  });
  $("pChars").addEventListener("change", () => {
    const v = $("pChars").value ? parseFloat($("pChars").value) : null;
    p.wordmark.chars = v ?? undefined;
    if (card) resizePreview(card, p);
    save(p, { chars: v });
  });
  P.querySelectorAll("[data-st]").forEach((b) => b.addEventListener("click", () => setStatus2(p, b.dataset.st, b.dataset.st === "ok")));
  $("pEdit").addEventListener("click", () => openEditor(p));
  $("pHide").addEventListener("click", () => toggleHide(p));
  $("pReplace").addEventListener("click", () => pickFile(p));
}
// 只更新卡片上的狀態標記（不重排整個清單）
function refreshCard(p) {
  const el = rowOf(p);
  if (!el) return;
  el.className = `row st-${statusOf(p.wordmark)}${p.wordmark.hidden ? " is-hidden" : ""}${el.classList.contains("current") ? " current" : ""}`;
}
function resizePreview(el, p) {
  el.querySelector(".wm").style.width = `${(wallWidth(p) * ZOOM).toFixed(0)}px`;
}
function setStatus(_el, msg, err) {
  const st = $("panelStatus");
  if (!st) return;
  st.textContent = msg;
  st.classList.toggle("err", !!err);
}
async function save(p, fields, el) {
  try {
    const r = await api("/__wordmarks/api/update", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug: p.slug, fields }) });
    p.wordmark = r.wordmark;
    setStatus(el, "已儲存");
    counts();
    return true;
  } catch (e) {
    setStatus(el, `儲存失敗：${e.message}`, true);
    return false;
  }
}
const rowOf = (p) => document.querySelector(`.row[data-slug="${CSS.escape(p.slug)}"]`);
// 設定狀態；需要換圖會一併隱藏。若新狀態不在目前的篩選裡，就停在原位置（等於自動跳到下一件）
async function setStatus2(p, st, advance = false) {
  const fields = { reviewed: st === "ok" || null, redo: st === "redo" || null, needsImage: st === "swap" || null };
  if (st === "swap") fields.hidden = true;
  // 隱藏是「需要換圖」連帶加上的；改回其他狀態時一併取消
  else if (statusOf(p.wordmark) === "swap") fields.hidden = null;
  const i = view.indexOf(p);
  const next = view[i + 1]?.slug ?? view[i - 1]?.slug;
  if (!(await save(p, fields))) return;
  const stillShown = filter === "all" || (filter === "hidden" ? p.wordmark.hidden : statusOf(p.wordmark) === ({ done: "ok" })[filter] || statusOf(p.wordmark) === filter);
  render(stillShown ? p.slug : next);
  if (advance && stillShown) move(1);
}
async function toggleHide(p) {
  if (await save(p, { hidden: !p.wordmark.hidden }, rowOf(p))) render(p.slug);
}

// ── 換圖：在瀏覽器裡轉成白字透明背景的 webp ─────────────────────────
let pickTarget = null;
function pickFile(p) { pickTarget = p; $("file").value = ""; $("file").click(); }
$("file").addEventListener("change", (e) => { const f = e.target.files?.[0]; if (f && pickTarget) replace(pickTarget, f); });

function otsu(lum) {
  const hist = new Float64Array(256);
  for (const v of lum) hist[v]++;
  const total = lum.length;
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let wB = 0, sumB = 0, best = 0, t = 128;
  for (let i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sumB += i * hist[i];
    const mB = sumB / wB, mF = (sum - sumB) / wF, between = wB * wF * (mB - mF) ** 2;
    if (between > best) { best = between; t = i; }
  }
  return t;
}
async function toWordmark(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const W = Math.round(bmp.width * scale), H = Math.round(bmp.height * scale);
  const c = new OffscreenCanvas(W, H), ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  const alpha = new Uint8ClampedArray(W * H);
  let transparent = 0;
  for (let i = 0; i < W * H; i++) if (d[i * 4 + 3] < 250) transparent++;
  const alreadyCut = transparent > W * H * 0.01;
  if (alreadyCut) {
    // 已去背：直接用透明度
    for (let i = 0; i < W * H; i++) alpha[i] = d[i * 4 + 3];
  } else {
    // 沒有透明背景：和 wut-collage-tool 預設一樣，Otsu 分亮暗、依外圈判斷字是亮或暗、柔邊
    const lum = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) lum[i] = Math.round(0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]);
    const t = otsu(lum);
    const band = Math.max(1, Math.min(32, Math.floor(Math.min(W, H) * 0.06)));
    let bright = 0, dark = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (x >= band && x < W - band && y >= band && y < H - band) continue;
      const v = lum[y * W + x];
      if (v >= t + 6) bright++; else if (v <= t - 6) dark++;
    }
    const keepBright = bright === dark ? t < 128 : bright < dark;
    const half = 20;
    for (let i = 0; i < W * H; i++) {
      const dist = keepBright ? lum[i] - t : t - lum[i];
      if (dist <= -half) continue;
      if (dist >= half) { alpha[i] = 255; continue; }
      let s = (dist + half) / (half * 2); s = s * s * (3 - 2 * s);
      alpha[i] = Math.round(s * 255);
    }
  }
  // 清掉零碎雜點：面積很小或很淡的連通區塊
  const label = new Int32Array(W * H), areas = [0], peaks = [0], stack = [];
  let n = 0;
  for (let i = 0; i < W * H; i++) {
    if (alpha[i] <= 40 || label[i]) continue;
    n++; let area = 0, peak = 0; stack.push(i); label[i] = n;
    while (stack.length) {
      const j = stack.pop(); area++; if (alpha[j] > peak) peak = alpha[j];
      const x = j % W, y = (j / W) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
        const k = yy * W + xx;
        if (!label[k] && alpha[k] > 40) { label[k] = n; stack.push(k); }
      }
    }
    areas.push(area); peaks.push(peak);
  }
  const big = Math.max(0, ...areas);
  for (let i = 0; i < W * H; i++) {
    const l = label[i];
    if (l && (areas[l] < Math.max(30, big * 0.002) || peaks[l] < 110)) alpha[i] = 0;
  }
  // 去掉模板的頁首／頁尾：最上或最下、和主體之間有空白隔開、墨量又很少的橫帶
  // 只用在沒有去背的原圖；已去背的圖（例如 wut 工具匯出的）照你調好的樣子保留
  const rowInk = new Float64Array(H);
  for (let y = 0; y < H; y++) { let s = 0; for (let x = 0; x < W; x++) if (alpha[y * W + x] > 40) s++; rowInk[y] = s; }
  const bands = [];
  for (let y = 0; y < H; ) {
    if (!rowInk[y]) { y++; continue; }
    const start = y; let ink = 0;
    // 中間允許 1.5% 高度以內的小空白，避免把同一個字切成兩段
    let gap = 0;
    while (y < H && gap <= H * 0.015) { if (rowInk[y]) { ink += rowInk[y]; gap = 0; } else gap++; y++; }
    bands.push({ start, end: y - gap, ink });
  }
  const totalInk = bands.reduce((s, b) => s + b.ink, 0);
  const small = (b) => b.ink < totalInk * 0.08 && b.end - b.start < H * 0.14;
  const clearRows = (b) => { for (let y = b.start; y < b.end; y++) for (let x = 0; x < W; x++) alpha[y * W + x] = 0; };
  if (!alreadyCut) {
    while (bands.length > 1 && small(bands[0])) clearRows(bands.shift());
    while (bands.length > 1 && small(bands[bands.length - 1])) clearRows(bands.pop());
  }
  // 裁到字的範圍（留 8px）
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (alpha[y * W + x] > 40) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) throw new Error("圖裡找不到字");
  x0 = Math.max(0, x0 - 8); y0 = Math.max(0, y0 - 8); x1 = Math.min(W - 1, x1 + 8); y1 = Math.min(H - 1, y1 + 8);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const crop = new OffscreenCanvas(cw, ch), cctx = crop.getContext("2d");
  const img = cctx.createImageData(cw, ch);
  let sum = 0;
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const a = alpha[(y + y0) * W + (x + x0)], k = (y * cw + x) * 4;
    img.data[k] = img.data[k + 1] = img.data[k + 2] = 255; img.data[k + 3] = a; sum += a;
  }
  cctx.putImageData(img, 0, 0);
  // 長邊縮到 800px
  const s2 = Math.min(1, 800 / Math.max(cw, ch));
  const out = new OffscreenCanvas(Math.round(cw * s2), Math.round(ch * s2));
  out.getContext("2d").drawImage(crop, 0, 0, out.width, out.height);
  const blob = await out.convertToBlob({ type: "image/webp", quality: 0.9 });
  return { blob, ink: sum / 255 / (cw * ch) };
}
async function replace(p, file) {
  const el = rowOf(p);
  setStatus(el, "處理中…");
  try {
    const { blob, ink } = await toWordmark(file);
    await api(`/__wordmarks/api/replace?slug=${encodeURIComponent(p.slug)}&ink=${ink.toFixed(3)}`, { method: "POST", body: blob });
    await load();
    const row = rowOf(p);
    setStatus(row, "已換圖，請確認效果");
    cur = Math.max(0, view.findIndex((x) => x.slug === p.slug));
    highlight(true);
  } catch (e) {
    setStatus(el, `換圖失敗：${e.message}`, true);
  }
}

// ── 精修視窗（iframe）：開啟、上一張／下一張、存檔後更新清單 ─────────────
const editorFrame = $("editorFrame");
let editorReady = false, editorPending = null, editorQueue = [], editorDone = new Set(), editorCurrent = null, editorChanged = false;
const toEditor = (m) => editorFrame.contentWindow.postMessage(m, location.origin);
function editorInfo(slug) {
  const p = all.find((x) => x.slug === slug);
  return {
    slug, title: p.title, post: p.post,
    // 精修從目前的字圖開始，不重新自動去背
    wordmark: `/projects/${encodeURIComponent(slug)}/wordmark.webp?v=${p.mtime}`,
    index: editorQueue.indexOf(slug), total: editorQueue.length,
    note: editorDone.size ? `本輪已處理 ${editorDone.size}` : "",
  };
}
function openEditor(p) {
  // 依目前清單（篩選＋排序）逐張處理
  editorQueue = view.map((x) => x.slug);
  if (!editorQueue.includes(p.slug)) editorQueue = [p.slug];
  editorDone = new Set();
  editorCurrent = p.slug;
  editorFrame.classList.add("show");
  if (!editorReady) {
    editorPending = p.slug;
    if (!editorFrame.src) editorFrame.src = "/__wordmarks/editor";
  } else {
    toEditor({ type: "open", info: editorInfo(p.slug) });
  }
}
window.addEventListener("message", async (e) => {
  if (e.origin !== location.origin || e.source !== editorFrame.contentWindow) return;
  const m = e.data || {};
  if (m.source !== "wordmark-editor") return;
  if (m.type === "ready") {
    editorReady = true;
    if (editorPending) { toEditor({ type: "open", info: editorInfo(editorPending) }); editorPending = null; }
  } else if (m.type === "changed") {
    editorDone.add(m.slug);
    editorChanged = true;
  } else if (m.type === "navigate") {
    const i = editorQueue.indexOf(m.slug);
    // 確認或標記換圖後跳到下一張還沒處理的；上一張／下一張則照順序
    const next = m.unfinished
      ? editorQueue.slice(i + 1).find((s) => !editorDone.has(s)) ?? editorQueue.slice(0, i).find((s) => !editorDone.has(s))
      : editorQueue[i + m.dir];
    if (next) { editorCurrent = next; toEditor({ type: "open", info: editorInfo(next) }); }
    else toEditor({ type: "none" });
  } else if (m.type === "closed") {
    editorFrame.classList.remove("show");
    if (editorChanged) { editorChanged = false; await load(); }
    render(editorCurrent);
    highlight(true);
  }
});

// ── 鍵盤逐件檢查 ───────────────────────────────────────────────
function highlight(scroll = true) {
  document.querySelectorAll(".row.current").forEach((r) => r.classList.remove("current"));
  const p = view[cur];
  const r = p && rowOf(p);
  renderPanel(r ? p : null);
  if (!r) return;
  r.classList.add("current");
  if (scroll) r.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function move(d) { cur = Math.min(view.length - 1, Math.max(0, cur + d)); highlight(); }
document.addEventListener("keydown", (e) => {
  // 打字的欄位不攔截；大小滑桿不擋 J／K 等快速鍵（方向鍵仍留給滑桿調整）
  if (e.target.matches?.('input:not([type="range"]), select, textarea')) return;
  if (e.target.matches?.('input[type="range"]') && e.key.startsWith("Arrow")) return;
  const p = view[cur];
  if (e.key === "j" || e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); move(1); }
  else if (e.key === "k" || e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); move(-1); }
  else if (e.key === "Enter" && p) { e.preventDefault(); if (statusOf(p.wordmark) !== "ok") setStatus2(p, "ok", true); else move(1); }
  else if (e.key === "r" && p) setStatus2(p, statusOf(p.wordmark) === "redo" ? "todo" : "redo");
  else if (e.key === "n" && p) setStatus2(p, statusOf(p.wordmark) === "swap" ? "todo" : "swap");
  else if (e.key === "e" && p) openEditor(p);
  else if (e.key === "h" && p) toggleHide(p);
  else if ((e.key === "-" || e.key === "=") && p) {
    const v = clampScale((p.wordmark.scale ?? 1) + (e.key === "=" ? 0.05 : -0.05));
    p.wordmark.scale = v;
    if ($("pScale")) { $("pScale").value = v; $("pScaleNum").value = v.toFixed(2); }
    const el = rowOf(p);
    if (el) resizePreview(el, p);
    save(p, { scale: v }).then(() => refreshCard(p));
  }
});
document.querySelectorAll("#filter button").forEach((b) => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll("#filter button").forEach((x) => x.classList.toggle("on", x === b));
  cur = 0; render();
}));
$("sort").addEventListener("change", () => { cur = 0; render(); });
$("q").addEventListener("input", () => { cur = 0; render(); });
$("zoom").addEventListener("input", () => {
  ZOOM = parseFloat($("zoom").value);
  try { localStorage.setItem("wm-admin-zoom2", String(ZOOM)); } catch (_) {}
  applyZoom();
  document.querySelectorAll(".row").forEach((el) => {
    const p = all.find((x) => x.slug === el.dataset.slug);
    if (!p) return;
    resizePreview(el, p);
  });
});
applyZoom();
// 右側面板固定在標頭下方：依標頭實際高度設定
const syncHeadH = () => document.documentElement.style.setProperty("--head-h", `${document.querySelector("header").offsetHeight}px`);
new ResizeObserver(syncHeadH).observe(document.querySelector("header"));
syncHeadH();
load().catch((e) => { $("list").innerHTML = `<p class="status err">載入失敗：${e.message}</p>`; });
</script>
</body>
