<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字圖管理</title>
<style>
  :root {
    --bg: #161616; --panel: #1f1f1f; --wall: #111; --fg: #eee; --mut: #8f8f8f;
    --line: #2e2e2e; --accent: #d7ea06; --warn: #e6a23c; --bad: #e5604f; --ok: #6cc28a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "PingFang TC", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  h1 { font-size: 16px; margin: 0 6px 0 0; }
  .count { color: var(--mut); }
  .count b { color: var(--fg); font-size: 15px; }
  .count b.todo { color: var(--accent); }
  .progress { display: flex; width: 160px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .progress span:first-child { background: var(--ok); }
  .progress span:last-child { background: var(--warn); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button + button { border-left: 1px solid var(--line); }
  button, select, input { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; }
  button.on { color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=search] { width: 160px; }
  .hint { color: var(--mut); font-size: 12px; flex-basis: 100%; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }
  main { padding: 12px 16px 80px; }
  .row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 270px; gap: 16px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-bottom: 10px; }
  .row.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .row.reviewed { opacity: 0.62; }
  .row.reviewed.current { opacity: 1; }
  .post img { width: 150px; height: 150px; object-fit: cover; border-radius: 6px; display: block; background: #000; }
  .post .none { width: 150px; height: 150px; border-radius: 6px; display: grid; place-items: center; background: #000; color: var(--mut); font-size: 12px; }
  .stage { position: relative; min-height: 180px; background: var(--wall); border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 28px; padding: 18px; overflow: hidden; }
  .stage.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .wm { flex: 0 1 auto; min-width: 0; max-width: calc(100% - 120px); height: auto !important; background: #f2f2f2; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .ref { flex: none; border: 1px dashed #555; color: #666; font-size: 11px; display: grid; place-items: end center; padding-bottom: 2px; }
  .hiddenTag { position: absolute; top: 8px; left: 10px; font-size: 12px; color: var(--bad); }
  .info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .title { font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .title a { color: var(--mut); font-size: 12px; font-weight: 400; }
  .flags { display: flex; gap: 6px; flex-wrap: wrap; }
  .flag { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--mut); }
  .flag.warn { color: var(--warn); border-color: #5a4320; }
  .flag.bad { color: var(--bad); border-color: #5a2a24; }
  .flag.ok { color: var(--ok); border-color: #24452f; }
  .ctl { display: grid; grid-template-columns: 52px 1fr 64px; gap: 6px 8px; align-items: center; font-size: 12px; color: var(--mut); }
  .ctl input[type=range] { width: 100%; accent-color: var(--accent); }
  .ctl input[type=number] { width: 64px; padding: 3px 6px; }
  .ctl .sv { width: 64px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts .confirm.on { color: var(--ok); border-color: #24452f; }
  .status { font-size: 12px; color: var(--mut); min-height: 1.5em; }
  .status.err { color: var(--bad); }
  @media (max-width: 860px) {
    .row { grid-template-columns: 100px minmax(0, 1fr); }
    .post img, .post .none { width: 100px; height: 100px; }
    .info { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <h1>字圖管理</h1>
  <span class="count">待分類 <b class="todo" id="cTodo">–</b> ／ 已分類 <b id="cClassified">–</b>（確認 <b id="cDone">–</b>、待重新去背 <b id="cRedo">–</b>）／ 隱藏 <b id="cHidden">–</b> ／ 共 <b id="cAll">–</b></span>
  <span class="progress" aria-hidden="true"><span id="pDone"></span><span id="pRedo"></span></span>
  <div class="seg" id="filter">
    <button data-f="todo" class="on">待分類</button>
    <button data-f="done">已確認</button>
    <button data-f="hidden">隱藏</button>
    <button data-f="redo">待重新去背</button>
    <button data-f="all">全部</button>
  </div>
  <select id="sort" aria-label="排序">
    <option value="risk">依風險排序</option>
    <option value="date">依日期（新到舊）</option>
    <option value="name">依名稱</option>
  </select>
  <input type="search" id="q" placeholder="搜尋作品名稱" aria-label="搜尋作品名稱">
  <button id="exportRedo">匯出待重新去背原圖</button>
  <button id="importBtn">匯入去背結果…</button>
  <span class="status" id="batchStatus" aria-live="polite"></span>
  <div class="hint">預覽大小 = 桌機字牆上的實際大小（虛線框為一個字的基準）。<kbd>J</kbd>/<kbd>K</kbd> 上下一件、<kbd>Enter</kbd> 確認並下一件、<kbd>H</kbd> 隱藏、<kbd>R</kbd> 標記重新去背、<kbd>-</kbd>/<kbd>=</kbd> 縮小放大。把圖拖到預覽區即可換圖。<br>用 wut 工具重新去背：標記「重新去背」→ 匯出原圖到桌面 → 在 wut 工具處理後「匯出 PNG」→ 把所有 <code>作品名_white.png</code> 一起拖進這個頁面任何地方（或按「匯入去背結果」），會依檔名自動對回作品。</div>
</header>
<main id="list"></main>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="importFiles" accept="image/*" multiple hidden>
<script>
// 和字牆相同的尺寸公式（ProjectCard.astro + gridViewMode.js），D = 1180 的桌機分段
const UNIT = Math.min(130, Math.max(68, 1180 * 0.074));
const INK_REF = 0.3;
// 手動大小倍率的範圍
const SCALE_MIN = 0.3, SCALE_MAX = 2.5;
const clampScale = (v) => Math.min(SCALE_MAX, Math.max(SCALE_MIN, Math.round(v * 100) / 100));
const countChars = (t) => Math.max(1, (t.match(/[\p{Script=Han}\p{Script=Bopomofo}\p{Script=Hiragana}\p{Script=Katakana}]/gu)?.length ?? 0) + (t.match(/[A-Za-z0-9]/g)?.length ?? 0) * 0.5);
function wallWidth(p) {
  const wm = p.wordmark, aspect = p.size.width / p.size.height;
  const chars = wm.chars ?? countChars(p.title);
  const ink = Math.min(0.8, Math.max(0.08, wm.ink ?? INK_REF));
  const sizeMul = ({ s: 0.8, m: 1, l: 1.3 })[wm.size ?? "m"];
  const mass = Math.max(1.6, (chars * (INK_REF / ink) ** 0.2 * sizeMul ** 2) ** 0.8);
  // 手動倍率最後直接乘在寬度上
  return Math.min(UNIT * Math.sqrt(mass * aspect) * (wm.scale ?? 1), 1180);
}
function flagsOf(p) {
  const wm = p.wordmark, f = [];
  const aspect = p.size.width / p.size.height;
  if (wm.reviewed) f.push(["ok", "已確認"]);
  if (wm.hidden) f.push(["bad", "隱藏中"]);
  if (wm.redo) f.push(["warn", "待重新去背"]);
  f.push(wm.source === "auto" ? ["warn", "自動去背"] : ["", "手作去背"]);
  if (aspect < 0.35 || aspect > 3.5) f.push(["warn", "長寬比極端"]);
  if ((wm.ink ?? 0.3) < 0.1) f.push(["warn", "墨量很少"]);
  if ((wm.ink ?? 0.3) > 0.6) f.push(["warn", "墨量很多，可能有底色"]);
  if (wm.chars) f.push(["", `字數 ${wm.chars}`]);
  if (wm.scale && wm.scale !== 1) f.push(["", `大小 ×${wm.scale}`]);
  return f;
}
const risk = (p) => (p.wordmark.reviewed ? 0 : 100) + (p.wordmark.redo ? 50 : 0) + (p.wordmark.hidden ? 30 : 0) + (p.wordmark.source === "auto" ? 20 : 0) + flagsOf(p).filter((f) => f[0] === "warn").length * 10;

let all = [], view = [], cur = 0, filter = "todo";
const $ = (id) => document.getElementById(id);
const api = async (url, opt) => {
  const r = await fetch(url, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};

async function load() {
  all = (await api("/__wordmarks/api/list")).filter((p) => p.wordmark && p.size);
  render();
}
function counts() {
  $("cAll").textContent = all.length;
  // 已分類 = 確認過，或標記了「待重新去背」（之後換圖會自動回到待分類）
  const done = all.filter((p) => p.wordmark.reviewed).length;
  const redo = all.filter((p) => !p.wordmark.reviewed && p.wordmark.redo).length;
  $("cTodo").textContent = all.length - done - redo;
  $("cDone").textContent = done;
  $("cClassified").textContent = done + redo;
  $("pDone").style.width = `${(done / Math.max(1, all.length)) * 100}%`;
  $("pRedo").style.width = `${(redo / Math.max(1, all.length)) * 100}%`;
  $("cHidden").textContent = all.filter((p) => p.wordmark.hidden).length;
  $("cRedo").textContent = all.filter((p) => p.wordmark.redo).length;
  $("exportRedo").textContent = `匯出待重新去背原圖（${all.filter((p) => p.wordmark.redo).length}）`;
}
function render(keepSlug) {
  counts();
  const q = $("q").value.trim();
  view = all.filter((p) =>
    (filter === "all" || (filter === "todo" && !p.wordmark.reviewed && !p.wordmark.redo) || (filter === "done" && p.wordmark.reviewed) || (filter === "hidden" && p.wordmark.hidden) || (filter === "redo" && p.wordmark.redo)) &&
    (!q || p.title.includes(q) || p.slug.includes(q)));
  const s = $("sort").value;
  view.sort(s === "date" ? (a, b) => b.date.localeCompare(a.date) : s === "name" ? (a, b) => a.title.localeCompare(b.title, "zh-Hant") : (a, b) => risk(b) - risk(a) || b.date.localeCompare(a.date));
  const L = $("list");
  L.innerHTML = view.length ? "" : `<p class="count">這個篩選條件下沒有作品${filter === "todo" ? "，全部都分類完了 🎉" : ""}。</p>`;
  view.forEach((p, i) => L.appendChild(rowEl(p, i)));
  if (keepSlug) cur = Math.max(0, view.findIndex((p) => p.slug === keepSlug));
  cur = Math.min(cur, Math.max(0, view.length - 1));
  highlight(false);
}
function rowEl(p, i) {
  const wm = p.wordmark;
  const el = document.createElement("section");
  el.className = "row" + (wm.reviewed ? " reviewed" : "");
  el.dataset.slug = p.slug;
  const w = wallWidth(p), h = w / (p.size.width / p.size.height);
  el.innerHTML = `
    <div class="post">${p.post ? `<img src="${p.post}" alt="" loading="lazy">` : `<div class="none">沒有貼文圖</div>`}</div>
    <div class="stage" title="把新的字圖拖到這裡即可換圖">
      ${wm.hidden ? `<span class="hiddenTag">隱藏中（不會出現在字牆）</span>` : ""}
      <span class="ref" style="width:${UNIT}px;height:${UNIT}px">一字</span>
      <span class="wm" style="--src:url('/projects/${encodeURIComponent(p.slug)}/wordmark.webp?v=${p.mtime}');width:${w.toFixed(0)}px;height:${h.toFixed(0)}px;aspect-ratio:${p.size.width}/${p.size.height}" role="img" aria-label="${p.title} 字圖"></span>
    </div>
    <div class="info">
      <div class="title">${p.title} <a href="/projects/${encodeURIComponent(p.slug)}" target="_blank" rel="noopener">作品頁 ↗</a></div>
      <div class="flags">${flagsOf(p).map(([c, t]) => `<span class="flag ${c}">${t}</span>`).join("")}</div>
      <div class="ctl">
        <label for="s-${i}">大小</label><input type="range" id="s-${i}" min="${SCALE_MIN}" max="${SCALE_MAX}" step="0.05" value="${wm.scale ?? 1}" data-act="scale"><input type="number" class="sv" min="${SCALE_MIN}" max="${SCALE_MAX}" step="0.05" value="${(wm.scale ?? 1).toFixed(2)}" aria-label="大小倍率">
        <label for="c-${i}">字數</label><input type="number" id="c-${i}" min="0.5" max="20" step="0.5" value="${wm.chars ?? ""}" placeholder="${countChars(p.title)}" data-act="chars"><span></span>
      </div>
      <div class="acts">
        <button class="confirm ${wm.reviewed ? "on" : ""}" data-act="confirm">${wm.reviewed ? "✓ 已確認" : "確認"}</button>
        <button data-act="hide">${wm.hidden ? "取消隱藏" : "隱藏"}</button>
        <button data-act="redo" class="${wm.redo ? "on" : ""}">${wm.redo ? "取消重新去背" : "重新去背"}</button>
        <button data-act="replace">換圖…</button>
      </div>
      <div class="status" aria-live="polite"></div>
    </div>`;
  el.addEventListener("click", () => { cur = view.indexOf(p); highlight(false); });
  const range = el.querySelector("[data-act=scale]");
  const num = el.querySelector(".sv");
  const preview = (v) => {
    p.wordmark.scale = v;
    range.value = v;
    num.value = v.toFixed(2);
    resizePreview(el, p);
  };
  range.addEventListener("input", () => preview(clampScale(parseFloat(range.value))));
  range.addEventListener("change", () => save(p, { scale: clampScale(parseFloat(range.value)) }, el));
  num.addEventListener("change", () => {
    const v = clampScale(parseFloat(num.value) || 1);
    preview(v);
    save(p, { scale: v }, el);
  });
  const chars = el.querySelector("[data-act=chars]");
  chars.addEventListener("change", () => {
    const v = chars.value ? parseFloat(chars.value) : null;
    p.wordmark.chars = v ?? undefined;
    resizePreview(el, p);
    save(p, { chars: v }, el);
  });
  el.querySelector("[data-act=confirm]").addEventListener("click", (e) => { e.stopPropagation(); toggleConfirm(p); });
  el.querySelector("[data-act=hide]").addEventListener("click", (e) => { e.stopPropagation(); toggleHide(p); });
  el.querySelector("[data-act=replace]").addEventListener("click", (e) => { e.stopPropagation(); pickFile(p); });
  el.querySelector("[data-act=redo]").addEventListener("click", (e) => { e.stopPropagation(); toggleRedo(p); });
  const stage = el.querySelector(".stage");
  stage.addEventListener("dragover", (e) => { e.preventDefault(); stage.classList.add("drop"); });
  stage.addEventListener("dragleave", () => stage.classList.remove("drop"));
  stage.addEventListener("drop", (e) => {
    e.preventDefault(); e.stopPropagation(); stage.classList.remove("drop");
    const f = e.dataTransfer.files?.[0];
    if (f) replace(p, f);
  });
  return el;
}
function resizePreview(el, p) {
  const w = wallWidth(p), h = w / (p.size.width / p.size.height);
  const wm = el.querySelector(".wm");
  wm.style.width = `${w.toFixed(0)}px`;
  wm.style.height = `${h.toFixed(0)}px`;
}
function setStatus(el, msg, err) {
  const s = el?.querySelector(".status");
  if (!s) return;
  s.textContent = msg;
  s.classList.toggle("err", !!err);
}
async function save(p, fields, el) {
  try {
    const r = await api("/__wordmarks/api/update", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug: p.slug, fields }) });
    p.wordmark = r.wordmark;
    setStatus(el, "已儲存");
    counts();
    return true;
  } catch (e) {
    setStatus(el, `儲存失敗：${e.message}`, true);
    return false;
  }
}
const rowOf = (p) => document.querySelector(`.row[data-slug="${CSS.escape(p.slug)}"]`);
async function toggleConfirm(p, advance) {
  const ok = await save(p, { reviewed: !p.wordmark.reviewed }, rowOf(p));
  if (!ok) return;
  const next = view[cur + 1]?.slug;
  render(advance && filter === "todo" ? next : p.slug);
  if (advance && filter !== "todo") move(1);
}
async function toggleRedo(p) {
  const next = view[view.indexOf(p) + 1]?.slug;
  if (!(await save(p, { redo: !p.wordmark.redo }, rowOf(p)))) return;
  render(filter === "todo" && p.wordmark.redo ? next : p.slug);
}
async function toggleHide(p) {
  if (await save(p, { hidden: !p.wordmark.hidden }, rowOf(p))) render(p.slug);
}

// ── 換圖：在瀏覽器裡轉成白字透明背景的 webp ─────────────────────────
let pickTarget = null;
function pickFile(p) { pickTarget = p; $("file").value = ""; $("file").click(); }
$("file").addEventListener("change", (e) => { const f = e.target.files?.[0]; if (f && pickTarget) replace(pickTarget, f); });

function otsu(lum) {
  const hist = new Float64Array(256);
  for (const v of lum) hist[v]++;
  const total = lum.length;
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let wB = 0, sumB = 0, best = 0, t = 128;
  for (let i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sumB += i * hist[i];
    const mB = sumB / wB, mF = (sum - sumB) / wF, between = wB * wF * (mB - mF) ** 2;
    if (between > best) { best = between; t = i; }
  }
  return t;
}
async function toWordmark(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const W = Math.round(bmp.width * scale), H = Math.round(bmp.height * scale);
  const c = new OffscreenCanvas(W, H), ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  const alpha = new Uint8ClampedArray(W * H);
  let transparent = 0;
  for (let i = 0; i < W * H; i++) if (d[i * 4 + 3] < 250) transparent++;
  const alreadyCut = transparent > W * H * 0.01;
  if (alreadyCut) {
    // 已去背：直接用透明度
    for (let i = 0; i < W * H; i++) alpha[i] = d[i * 4 + 3];
  } else {
    // 沒有透明背景：和 wut-collage-tool 預設一樣，Otsu 分亮暗、依外圈判斷字是亮或暗、柔邊
    const lum = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) lum[i] = Math.round(0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]);
    const t = otsu(lum);
    const band = Math.max(1, Math.min(32, Math.floor(Math.min(W, H) * 0.06)));
    let bright = 0, dark = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (x >= band && x < W - band && y >= band && y < H - band) continue;
      const v = lum[y * W + x];
      if (v >= t + 6) bright++; else if (v <= t - 6) dark++;
    }
    const keepBright = bright === dark ? t < 128 : bright < dark;
    const half = 20;
    for (let i = 0; i < W * H; i++) {
      const dist = keepBright ? lum[i] - t : t - lum[i];
      if (dist <= -half) continue;
      if (dist >= half) { alpha[i] = 255; continue; }
      let s = (dist + half) / (half * 2); s = s * s * (3 - 2 * s);
      alpha[i] = Math.round(s * 255);
    }
  }
  // 清掉零碎雜點：面積很小或很淡的連通區塊
  const label = new Int32Array(W * H), areas = [0], peaks = [0], stack = [];
  let n = 0;
  for (let i = 0; i < W * H; i++) {
    if (alpha[i] <= 40 || label[i]) continue;
    n++; let area = 0, peak = 0; stack.push(i); label[i] = n;
    while (stack.length) {
      const j = stack.pop(); area++; if (alpha[j] > peak) peak = alpha[j];
      const x = j % W, y = (j / W) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
        const k = yy * W + xx;
        if (!label[k] && alpha[k] > 40) { label[k] = n; stack.push(k); }
      }
    }
    areas.push(area); peaks.push(peak);
  }
  const big = Math.max(0, ...areas);
  for (let i = 0; i < W * H; i++) {
    const l = label[i];
    if (l && (areas[l] < Math.max(30, big * 0.002) || peaks[l] < 110)) alpha[i] = 0;
  }
  // 去掉模板的頁首／頁尾：最上或最下、和主體之間有空白隔開、墨量又很少的橫帶
  // 只用在沒有去背的原圖；已去背的圖（例如 wut 工具匯出的）照你調好的樣子保留
  const rowInk = new Float64Array(H);
  for (let y = 0; y < H; y++) { let s = 0; for (let x = 0; x < W; x++) if (alpha[y * W + x] > 40) s++; rowInk[y] = s; }
  const bands = [];
  for (let y = 0; y < H; ) {
    if (!rowInk[y]) { y++; continue; }
    const start = y; let ink = 0;
    // 中間允許 1.5% 高度以內的小空白，避免把同一個字切成兩段
    let gap = 0;
    while (y < H && gap <= H * 0.015) { if (rowInk[y]) { ink += rowInk[y]; gap = 0; } else gap++; y++; }
    bands.push({ start, end: y - gap, ink });
  }
  const totalInk = bands.reduce((s, b) => s + b.ink, 0);
  const small = (b) => b.ink < totalInk * 0.08 && b.end - b.start < H * 0.14;
  const clearRows = (b) => { for (let y = b.start; y < b.end; y++) for (let x = 0; x < W; x++) alpha[y * W + x] = 0; };
  if (!alreadyCut) {
    while (bands.length > 1 && small(bands[0])) clearRows(bands.shift());
    while (bands.length > 1 && small(bands[bands.length - 1])) clearRows(bands.pop());
  }
  // 裁到字的範圍（留 8px）
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (alpha[y * W + x] > 40) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) throw new Error("圖裡找不到字");
  x0 = Math.max(0, x0 - 8); y0 = Math.max(0, y0 - 8); x1 = Math.min(W - 1, x1 + 8); y1 = Math.min(H - 1, y1 + 8);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const crop = new OffscreenCanvas(cw, ch), cctx = crop.getContext("2d");
  const img = cctx.createImageData(cw, ch);
  let sum = 0;
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const a = alpha[(y + y0) * W + (x + x0)], k = (y * cw + x) * 4;
    img.data[k] = img.data[k + 1] = img.data[k + 2] = 255; img.data[k + 3] = a; sum += a;
  }
  cctx.putImageData(img, 0, 0);
  // 長邊縮到 800px
  const s2 = Math.min(1, 800 / Math.max(cw, ch));
  const out = new OffscreenCanvas(Math.round(cw * s2), Math.round(ch * s2));
  out.getContext("2d").drawImage(crop, 0, 0, out.width, out.height);
  const blob = await out.convertToBlob({ type: "image/webp", quality: 0.9 });
  return { blob, ink: sum / 255 / (cw * ch) };
}
async function replace(p, file) {
  const el = rowOf(p);
  setStatus(el, "處理中…");
  try {
    const { blob, ink } = await toWordmark(file);
    await api(`/__wordmarks/api/replace?slug=${encodeURIComponent(p.slug)}&ink=${ink.toFixed(3)}`, { method: "POST", body: blob });
    await load();
    const row = rowOf(p);
    setStatus(row, "已換圖，請確認效果");
    cur = Math.max(0, view.findIndex((x) => x.slug === p.slug));
    highlight(true);
  } catch (e) {
    setStatus(el, `換圖失敗：${e.message}`, true);
  }
}

// ── wut 工具來回：匯出原圖、依檔名批次匯入 ─────────────────────────
$("exportRedo").addEventListener("click", async () => {
  const st = $("batchStatus");
  try {
    const r = await api("/__wordmarks/api/export-redo", { method: "POST" });
    st.classList.remove("err");
    st.textContent = r.files.length
      ? `已複製 ${r.files.length} 張到 ${r.dir}${r.missing.length ? `（${r.missing.length} 件沒有貼文圖：${r.missing.join("、")}）` : ""}`
      : "沒有標記「重新去背」的作品";
  } catch (e) { st.classList.add("err"); st.textContent = `匯出失敗：${e.message}`; }
});
$("importBtn").addEventListener("click", () => { $("importFiles").value = ""; $("importFiles").click(); });
$("importFiles").addEventListener("change", (e) => importFiles([...e.target.files]));
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => {
  e.preventDefault();
  const files = [...(e.dataTransfer.files || [])].filter((f) => f.type.startsWith("image/"));
  if (files.length) importFiles(files);
});
// wut 工具匯出的檔名是「原檔名_white.png」；瀏覽器重複下載會加「 (1)」
const nameKey = (f) => f.name.replace(/\.[^.]+$/, "").replace(/\s*\(\d+\)$/, "").replace(/_white$/i, "").replace(/^@/, "").normalize("NFC");
async function importFiles(files) {
  const st = $("batchStatus");
  st.classList.remove("err");
  const done = [], unmatched = [], failed = [];
  for (const [i, f] of files.entries()) {
    const key = nameKey(f);
    const p = all.find((x) => x.slug.normalize("NFC") === key) ?? all.find((x) => x.title.normalize("NFC") === key);
    if (!p) { unmatched.push(f.name); continue; }
    st.textContent = `匯入中 ${i + 1}/${files.length}：${p.title}`;
    try {
      const { blob, ink } = await toWordmark(f);
      await api(`/__wordmarks/api/replace?slug=${encodeURIComponent(p.slug)}&ink=${ink.toFixed(3)}`, { method: "POST", body: blob });
      done.push(p.title);
    } catch (e) { failed.push(`${p.title}（${e.message}）`); }
  }
  await load();
  st.classList.toggle("err", unmatched.length + failed.length > 0);
  st.textContent = [
    `已換圖 ${done.length} 件${done.length ? "，換過的作品回到「未確認」" : ""}`,
    unmatched.length ? `對不到作品：${unmatched.join("、")}` : "",
    failed.length ? `失敗：${failed.join("、")}` : "",
  ].filter(Boolean).join("　");
}

// ── 鍵盤逐件檢查 ───────────────────────────────────────────────
function highlight(scroll = true) {
  document.querySelectorAll(".row.current").forEach((r) => r.classList.remove("current"));
  const p = view[cur];
  const r = p && rowOf(p);
  if (!r) return;
  r.classList.add("current");
  if (scroll) r.scrollIntoView({ block: "center", behavior: "smooth" });
}
function move(d) { cur = Math.min(view.length - 1, Math.max(0, cur + d)); highlight(); }
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea")) return;
  const p = view[cur];
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "Enter" && p) { e.preventDefault(); if (!p.wordmark.reviewed) toggleConfirm(p, true); else move(1); }
  else if (e.key === "r" && p) toggleRedo(p);
  else if (e.key === "h" && p) toggleHide(p);
  else if ((e.key === "-" || e.key === "=") && p) {
    const v = clampScale((p.wordmark.scale ?? 1) + (e.key === "=" ? 0.05 : -0.05));
    p.wordmark.scale = v;
    const el = rowOf(p);
    el.querySelector("[data-act=scale]").value = v;
    el.querySelector(".sv").value = v.toFixed(2);
    resizePreview(el, p);
    save(p, { scale: v }, el);
  }
});
document.querySelectorAll("#filter button").forEach((b) => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll("#filter button").forEach((x) => x.classList.toggle("on", x === b));
  cur = 0; render();
}));
$("sort").addEventListener("change", () => { cur = 0; render(); });
$("q").addEventListener("input", () => { cur = 0; render(); });
load().catch((e) => { $("list").innerHTML = `<p class="status err">載入失敗：${e.message}</p>`; });
</script>
</body>
